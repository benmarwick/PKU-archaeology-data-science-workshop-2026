name: Test Lesson Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install workshop packages
        run: Rscript install.R

      - name: Run lesson code extraction and test
        run: Rscript code/extract_lesson_code.R